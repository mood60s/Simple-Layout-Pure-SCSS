<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SASS Practice</title>
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <!-- Library -->
    <link rel="stylesheet" href="css/vendor/normalize.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body dir="ltr">
    <!-- Start Header -->
    <header class="header">
      <button class="the-toggler">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="container">
        <div class="content">
          <div class="logo">
            <h1></h1>
            <p></p>
          </div>
          <ul class="navbar">
            <li>
              <a href="#"></a>
            </li>
            <li>
              <a href="#"></a>
            </li>
            <li>
              <a href="#"></a>
            </li>
            <li>
              <a href="#"></a>
            </li>
            <li>
              <a href="#"></a>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <!-- End Header -->
    <!-- Slider -->
    <section class="slider">
      <div class="container">
        <q class="quote"></q>
        <div class="carousel">
          <div class="track">
            <img src="imgs/features-01.jpg" alt="" class="slide active" />
            <img src="imgs/features-02.jpg" alt="" class="slide" />
            <img src="imgs/features-03.jpg" alt="" class="slide" />
          </div>
        </div>
        <ul class="bullets">
          <li class="active"></li>
          <li></li>
          <li></li>
        </ul>
      </div>
    </section>
    <!-- End Slider -->
    <!-- start services -->
    <section class="services">
      <div class="container">
        <div class="head-with-border">
          <h2 class="our-service"></h2>
        </div>
        <div class="service-content text-center-xs">
          <div class="service-box">
            <div class="info">
              <i class="fa fa-home service-icon"> </i>
              <h3 class="service-title"></h3>
            </div>
            <p class="service-desc"></p>
            <a href="#" class="service-link"></a>
          </div>
          <div class="service-box">
            <div class="info">
              <i class="fa fa-users service-icon"> </i>
              <h3 class="service-title"></h3>
            </div>
            <p class="service-desc"></p>
            <a href="#" class="service-link"></a>
          </div>
          <div class="service-box">
            <div class="info">
              <i class="fa fa-gear service-icon"> </i>
              <h3 class="service-title"></h3>
            </div>
            <p class="service-desc"></p>
            <a href="#" class="service-link"></a>
          </div>
        </div>
      </div>
    </section>
    <!-- End Services -->
    <!-- Our Players -->
    <section class="our-players">
      <div class="container">
        <div class="head-with-border">
          <h2 class="title-sec-ourplayer"></h2>
        </div>
        <div class="player-content text-center-xs">
          <div class="player-box">
            <div class="info">
              <img src="/imgs/p1.jpg" class="player-img mx-auto-xs" alt="" />
              <h3 class="player-title"></h3>
              <p class="player-desc"></p>
              <a href="#" class="player-link"></a>
            </div>
          </div>
          <div class="player-box">
            <div class="info">
              <img src="/imgs/p2.jpg" class="player-img mx-auto-xs" alt="" />
              <h3 class="player-title"></h3>
              <p class="player-desc"></p>
              <a href="#" class="player-link"></a>
            </div>
          </div>
          <div class="player-box">
            <div class="info">
              <img src="/imgs/p3.jpg" class="player-img mx-auto-xs" alt="" />
              <h3 class="player-title"></h3>
              <p class="player-desc"></p>
              <a href="#" class="player-link"></a>
            </div>
          </div>
          <div class="player-box">
            <div class="info">
              <img src="/imgs/p5.jpg" class="player-img mx-auto-xs" alt="" />
              <h3 class="player-title"></h3>
              <p class="player-desc"></p>
              <a href="#" class="player-link"></a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- End Our Players -->
    <!-- Start Lorem ipsum -->
    <section class="lorem-ipsum">
      <div class="container">
        <div class="head-with-border">
          <h2 class="title-sec-lorem-ipsum"></h2>
        </div>
        <div class="lorem-boxs">
          <div class="lorem-box">
            <img src="imgs/features-01.jpg" alt="" class="lorem-img" />
          </div>
          <div class="lorem-box">
            <img src="imgs/features-02.jpg" alt="" class="lorem-img" />
          </div>
          <div class="lorem-box">
            <img src="imgs/features-03.jpg" alt="" class="lorem-img" />
          </div>
        </div>
      </div>
    </section>
    <!-- end Lorem Ipsum -->
    <!-- Switch Languages -->
    <div class="languages">
      <button onclick="setLang('en', 'ltr')" class="eng">EN</button>
      <button onclick="setLang('ar', 'rtl')" class="ar">AR</button>
    </div>
    <!-- End Switch Langugaes -->
    <!-- Start Footer -->
    <!-- End Footer -->
    <footer class="footer">
      <div class="container">
        <div class="content-company text-center-xs">
          <div class="gallery child">
            <h3 class="section-title mx-auto-xs"></h3>
            <div class="img-box">
              <img class="img-gallery" src="imgs/idea.avif" alt="" />
              <div class="text">
                <h4 class="title-gallery"></h4>
                <p class="desc-gallery"></p>
              </div>
            </div>
            <div class="img-box">
              <img class="img-gallery" src="imgs/idea2.png" alt="" />
              <div class="text">
                <h4 class="title-gallery"></h4>
                <p class="desc-gallery"></p>
              </div>
            </div>
          </div>
          <div class="info-company child">
            <h3 class="section-title mx-auto-xs"></h3>
            <ul class="details">
              <li class="deatil"></li>
              <li class="deatil"></li>
              <li class="deatil"></li>
              <li class="deatil"></li>
              <li class="deatil"></li>
              <li class="deatil"></li>
            </ul>
            <h4 class="working"></h4>
            <p class="desc-company"></p>
          </div>
          <div class="contact child">
            <h3 class="section-title mx-auto-xs"></h3>
            <form>
              <input type="text" class="my-input" />
              <input type="email" class="my-input" />
              <textarea class="my-input"></textarea>
              <button type="button" class="main-button submit-button"></button>
            </form>
          </div>
        </div>
        <div class="copyright">
          <div class="text"></div>
          <div class="author">
            <span></span>
          </div>
        </div>
      </div>
    </footer>
    <script src="js/Languages.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
